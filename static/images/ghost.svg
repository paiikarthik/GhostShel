<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="ghostGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="spectralBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="50" cy="45" r="42" fill="url(#ghostGlow)" class="ghost-aura" />

  <!-- Ghost Body -->
  <path d="M 50 12 
           C 30 12 20 28 20 50 
           C 20 68 22 84 26 84 
           C 30 84 34 76 38 76 
           C 42 76 46 84 50 84 
           C 54 84 58 76 62 76 
           C 66 76 70 84 74 84 
           C 78 84 80 68 80 50 
           C 80 28 70 12 50 12 Z" 
        fill="#f8fafc" 
        stroke="#8b5cf6" 
        stroke-width="2.5" 
        filter="url(#spectralBlur)"
        class="ghost-body"/>

  <!-- Left Eye -->
  <ellipse cx="38" cy="42" rx="4.5" ry="6" fill="#0f172a" class="ghost-eye left-eye">
    <animate attributeName="ry" values="6;0.5;6" dur="4s" repeatCount="indefinite" begin="1s"/>
  </ellipse>
  <circle cx="36.5" cy="40" r="1.5" fill="#22d3ee" />

  <!-- Right Eye -->
  <ellipse cx="62" cy="42" rx="4.5" ry="6" fill="#0f172a" class="ghost-eye right-eye">
    <animate attributeName="ry" values="6;0.5;6" dur="4s" repeatCount="indefinite" begin="1s"/>
  </ellipse>
  <circle cx="60.5" cy="40" r="1.5" fill="#22d3ee" />

  <!-- Friendly Spooky Mouth -->
  <ellipse cx="50" cy="56" rx="5" ry="4" fill="#0f172a" class="ghost-mouth"/>

  <!-- Spectral Sparks -->
  <circle cx="22" cy="30" r="1.5" fill="#00ff88" opacity="0.8">
    <animate attributeName="cy" values="30;18;30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="78" cy="34" r="1.5" fill="#a855f7" opacity="0.8">
    <animate attributeName="cy" values="34;22;34" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
